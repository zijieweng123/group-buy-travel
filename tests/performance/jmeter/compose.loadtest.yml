# Dedicated local storage; no volumes or ports are shared with development services.
name: group-buy-perf
services:
  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/mysql:8.0.32
    container_name: group-buy-perf-mysql
    environment:
      MYSQL_ROOT_PASSWORD: loadtest-only
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:33306:3306"]
    volumes:
      - "./bootstrap/01-base.sql:/docker-entrypoint-initdb.d/01-base.sql:ro"
      - "./bootstrap/02-travel.sql:/docker-entrypoint-initdb.d/02-travel.sql:ro"
      - mysql-data:/var/lib/mysql
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=ON", "--max-connections=60", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ploadtest-only"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4
    container_name: group-buy-perf-redis
    ports: ["127.0.0.1:36379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    container_name: group-buy-perf-kafka
    ports: ["127.0.0.1:39092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:39092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 24
volumes:
  mysql-data:
  redis-data:
  kafka-data:
