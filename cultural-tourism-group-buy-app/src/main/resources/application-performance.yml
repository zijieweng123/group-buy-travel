# Opt-in profile for the single-instance real-trade benchmark.
# Activate with --spring.profiles.active=dev,performance; connection endpoints stay external.
server:
  tomcat:
    threads:
      max: 50
    max-connections: 200
    accept-count: 100

spring:
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 2
      data-source-properties:
        # Transaction state must be changed through JDBC APIs, not raw SET statements.
        useLocalSessionState: true

trade:
  notify-threads: 12
  read-snapshots:
    enabled: true
  inventory:
    reservation:
      enabled: true
  trace:
    enabled: false
  notify:
    batch:
      enabled: true

logging:
  level:
    root: WARN
